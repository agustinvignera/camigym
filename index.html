--bg:light-dark(#eef1f3,#0f171e);--card:light-dark(#fff,#18232d);--ink:light-dark(#13212d,#e8eef2);--mute:light-dark(#5d6f7e,#94a7b6);

*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Outfit,system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}

.app{max-width:480px;margin:0 auto;min-height:100dvh;background:var(--bg);position:relative;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.proto{display:flex;align-items:center;gap:8px;padding:8px 14px;padding-top:calc(8px + env(safe-area-inset-top));background:#0c151d;color:#cfdbe3;font-size:13px}
.proto span{flex:1}

.seg button{border:0;background:none;color:#cfdbe3;padding:6px 14px;border-radius:99px;font-size:13px;font-weight:600;min-height:32px}

.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px}
.mob{display:flex;align-items:center;gap:12px;border:0;width:100%;text-align:left;background:var(--sand)}
.mob .play{background:var(--sl)}
.mob p{margin:0;font-size:13px;color:var(--mute)}
.rt{margin:20px 0 10px}
.rt h2{font-size:34px;line-height:1;margin:0;font-weight:800}
.rt p{margin:4px 0 0;color:var(--sl2);font-weight:700;font-size:18px}

.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
.nav button{flex:1;border:0;background:none;padding:10px 2px 12px;font-size:12px;font-weight:600;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:3px;min-height:60px}

@media(min-width:520px){.app{box-shadow:0 0 0 1px var(--line)}}
</style>
</head>

function exUps(A){ // ejercicios con peso mejorado (uno por ejercicio), con la fecha del primer aumento
  const m={};for(const key in A.pes){const[w,d,b,i,s]=key.split('-').map(Number),it=A.plan.weeks[w]?.days[d]?.b[b]?.i[i];if(!it||!it.s[s])continue;
    if(num(A.pes[key].v)>num(it.s[s].p)){const ek=[w,d,b,i].join('-'),dd=A.pes[key].d||TODAY;if(!m[ek]||dd<m[ek])m[ek]=dd}}
  return Object.values(m);
}
function score(A){
  const st=mondayOf(dt(A.inicio)),ses=A.ses.filter(s=>s.d>=A.inicio),ups=exUps(A).filter(d=>d>=A.inicio),W=A.plan.weeks;
  let p=0,w=0,miss=0;
  for(let ws=st;ws<=today;ws=new Date(ws.getTime()+7*DAY),w++){
    const a=iso(ws),b=iso(new Date(ws.getTime()+7*DAY));
    const n=ses.filter(s=>s.d>=a&&s.d<b).length;p+=10*n+5*ups.filter(d=>d>=a&&d<b).length;
    if(b<=TODAY){const exp=W.length?(W[Math.min(w,W.length-1)].days.length):3,m=Math.max(0,exp-n);miss+=m;p-=10*m}
    p=Math.max(0,p);
  }
  const lv=Math.min(LV.length-1,Math.floor(p/100));
  return{p,lv,miss,ses:ses.length,ups:ups.length,next:lv<LV.length-1?(lv+1)*100-p:0};
}

  if('addb' in d){D().b.push({x:3,wu:!D().b.length,i:[blankItem()]});savePlan(Al);render();return}
  if(d.delb){D().b.splice(+d.delb,1);savePlan(Al);render();return}
  if(d.addi){D().b[+d.addi].i.push(blankItem());savePlan(Al);render();return}
  if(d.deli){const[b,i]=d.deli.split('-').map(Number);D().b[b].i.splice(i,1);if(!D().b[b].i.length)D().b.splice(b,1);savePlan(Al);render();return}
  if(d.adds){const[b,i]=d.adds.split('-').map(Number),s=D().b[b].i[i].s;s.push({...s[s.length-1]});savePlan(Al);render();return}
  if(d.dels){const[b,i,s]=d.dels.split('-').map(Number);D().b[b].i[i].s.splice(s,1);savePlan(Al);render();return}
  if('preview' in d){S.role='al';S.tab='hoy';S.aid=Al.id;S.wk=S.ewk;S.dy=S.edy;render();scrollTo(0,0);return}
});
document.addEventListener('input',ev=>{
  const t=ev.target,d=t.dataset;
  if(t.id==='com'){const b=document.getElementById('sendc');if(b)b.disabled=!t.value.trim();return}
  if(t.id==='q'){S.q=t.value;const pos=t.selectionStart;render();const q=document.getElementById('q');q.focus();q.setSelectionRange(pos,pos);return}
  if(d.w){const Al=A(),v=t.value.trim(),val=v?(/[a-z]/i.test(v)?v:v+'kg'):'';if(val)Al.pes[d.w]={v:val,d:Al.pes[d.w]?.d||TODAY};else delete Al.pes[d.w];render();debounce('w'+d.w,()=>remote('alumno_peso',{p_key:d.w,p_v:val||null}));return}
  const Al=EA();
  if(t.id==='inicio'){if(t.value){Al.inicio=t.value;savePlan(Al)}return}
  if(d.f){D()[d.f]=t.value;savePlan(Al);return}
  if(d.x){D().b[+d.x].x=t.value.replace(/\D/g,'')||1;savePlan(Al);return}
  if(d.sr||d.sp){const[b,i,s]=(d.sr||d.sp).split('-').map(Number);D().b[b].i[i].s[s][d.sr?'r':'p']=t.value;savePlan(Al);return}
  if(d.n){const[b,i]=d.n.split('-').map(Number);D().b[b].i[i].n=t.value;savePlan(Al);return}
});
document.addEventListener('change',ev=>{const t=ev.target,d=t.dataset;
  if(t.id==='eal'){S.eaid=t.value;S.ewk=0;S.edy=0;render();return}
  if(d.e){const[b,i]=d.e.split('-').map(Number);D().b[b].i[i].e=t.value;savePlan(EA())}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&sheet.classList.contains('open'))closeSheet()});

// ===== Arranque =====
async function boot(){
  if(MODE==='demo'){let x;try{x=JSON.parse(localStorage.getItem('camigym-v2'))}catch(e){}DB=x&&x.v===2?x:seedDemo();saveLocal()}
  else if(MODE==='none'){app.innerHTML=`<div class="center"><div><div class="brand" style="justify-content:center;color:var(--sl2)">Camila Lasa <i>entrenamientos</i></div><h1>Pedile tu link a Camila</h1><p style="color:var(--mute)">Cada alumno entra con su link personal.<br>Escribile y te lo manda por WhatsApp.</p></div></div>`;return}
  else{try{const r=await rpc(MODE==='profe'?'profe_load':'alumno_load',{p_token:TOKEN});DB={ex:r.ex||{},alumnos:MODE==='profe'?r.alumnos:[r.alumno]}}
    catch(e){app.innerHTML=`<div class="center"><div><h1>No pudimos abrir tu rutina</h1><p style="color:var(--mute)">${/autoriz|token/i.test(e.message)?'El link no es válido. Pedile a Camila uno nuevo.':'Revisá tu conexión y volvé a intentar.'}</p><button class="btn" onclick="location.reload()">Reintentar</button></div></div>`;return}}
  for(const a of DB.alumnos){a.plan=a.plan&&a.plan.weeks?a.plan:{weeks:[]};a.ses=a.ses||[];a.pes=a.pes||{};a.com=a.com||[]}
  S.aid=DB.alumnos[0]?.id;S.eaid=S.aid;pickDay();render();
}
boot();
}
</script>
