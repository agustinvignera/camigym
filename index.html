<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2c4054">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Camila Lasa · Rutinas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400;500;600;700;800&family=Yellowtail&display=swap" rel="stylesheet">
<style>
/* VOICE: entrenadora cercana, enérgica, clara en el gimnasio con el celular en la mano
   IDEA: la planilla de rutina del PDF de Camila, convertida en tarjetas que se tocan
   PICTURE: la rutina misma — bloques con series, reps y peso; el video se abre adentro
   COLOUR and TYPE: turquesa de marca, azul pizarra, celeste y arena del PDF; Bebas Neue + Outfit, Yellowtail solo para el lema
   LAYOUT: una columna de celular (máx 480px), barra inferior por pestañas, hojas que suben desde abajo */
:root{color-scheme:light dark;
--bg:light-dark(#eef1f3,#0f171e);--card:light-dark(#fff,#18232d);--ink:light-dark(#13212d,#e8eef2);--mute:light-dark(#5d6f7e,#94a7b6);
--line:light-dark(#dfe6eb,#26343f);--tq:#22d8d4;--tqd:light-dark(#0f9e9b,#3fe3df);--sl:#2c4054;--sl2:light-dark(#8aa9c1,#5f7f98);
--sky:light-dark(#d4e3ec,#1f3240);--sand:light-dark(#e6ddcb,#3a3427);--ok:light-dark(#11865f,#4fd3a1)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Outfit,system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--tq);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100dvh;background:var(--bg);position:relative;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.proto{display:flex;align-items:center;gap:8px;padding:8px 14px;padding-top:calc(8px + env(safe-area-inset-top));background:#0c151d;color:#cfdbe3;font-size:13px}
.proto span{flex:1}
.seg{display:flex;background:#1f2e3b;border-radius:99px;padding:3px}
.seg button{border:0;background:none;color:#cfdbe3;padding:6px 14px;border-radius:99px;font-size:13px;font-weight:600;min-height:32px}
.seg button.on{background:var(--tq);color:#06302f}
.hero{background:var(--sl);color:#fff;padding:22px 18px 20px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-40px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(34,216,212,.35),transparent 65%)}
.brand{font-family:"Bebas Neue";letter-spacing:.04em;font-size:20px;line-height:1;display:flex;align-items:center;gap:8px}
.brand i{font-style:normal;color:var(--tq);font-size:13px;letter-spacing:.1em}
.hero h1{font-size:34px;line-height:1.05;margin:14px 0 2px;font-weight:800}
.hero .date{color:#bfe9ef;font-size:16px}.hero .date::first-letter{text-transform:uppercase}
.motto{font-family:Yellowtail;font-size:22px;color:var(--tq);position:absolute;right:18px;bottom:16px;z-index:1}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border-radius:99px;padding:4px 12px;font-size:13px;margin-top:12px}
.wrap{padding:16px}
.weeks{display:flex;gap:6px;margin-bottom:12px}
.weeks button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 4px;font-weight:600;font-size:14px;min-height:44px}
.weeks button.on{background:var(--sl);color:#fff;border-color:var(--sl)}
.weeks button small{display:block;font-weight:400;font-size:12px;opacity:.75}
.days{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:16px}
.day{border:2px solid transparent;background:var(--card);border-radius:14px;padding:10px;text-align:left;min-height:84px;position:relative}
.day b{display:block;font-family:"Bebas Neue";font-size:20px;letter-spacing:.03em;line-height:1}
.day span{font-size:12.5px;color:var(--mute);line-height:1.25;display:block;margin-top:4px}
.day.on{border-color:var(--tq)}
.day .ck{position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:50%;background:var(--ok);display:grid;place-items:center}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px}
.mob{display:flex;align-items:center;gap:12px;border:0;width:100%;text-align:left;background:var(--sand)}
.mob .play{background:var(--sl)}
.mob p{margin:0;font-size:13px;color:var(--mute)}
.rt{margin:20px 0 10px}
.rt h2{font-size:34px;line-height:1;margin:0;font-weight:800}
.rt p{margin:4px 0 0;color:var(--sl2);font-weight:700;font-size:18px}
.blk{background:var(--card);border-radius:16px;margin-bottom:12px;overflow:hidden;display:grid;grid-template-columns:54px minmax(0,1fr)}
.blk .sr{background:var(--sky);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--mute);text-align:center;line-height:1.1}
.blk .sr b{font-family:"Bebas Neue";font-size:30px;color:var(--ink);line-height:1}
.blk.wu .sr{background:var(--sand)}
.it{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:0}
.play{width:44px;height:44px;border-radius:12px;border:0;background:var(--tq) center/cover;display:grid;place-items:center;position:relative;overflow:hidden;flex:none}
.play img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.play svg{position:relative;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
.nm{border:0;background:none;padding:0;text-align:left;font-weight:600;font-size:15px;line-height:1.3}
.nt{font-size:12.5px;color:var(--mute);margin-top:2px;line-height:1.3}
.sets{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.set{display:flex;gap:6px;align-items:center;white-space:nowrap}
.rp{font-size:13px;color:var(--mute);min-width:34px;text-align:right}
.kg{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:4px 9px;font-weight:700;font-size:14px;min-height:32px;min-width:58px}
.kg.up{border-color:var(--ok);color:var(--ok)}
.kg s{display:block;font-size:10.5px;font-weight:400;color:var(--mute);line-height:1}
.lbl{font-weight:700;font-size:15px;margin:18px 0 8px}
textarea,input[type=text],input[type=url],select{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px;font-size:16px}
textarea{min-height:92px;resize:vertical}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;padding:14px;font-weight:700;font-size:16px;background:var(--tq);color:#06302f;min-height:50px;margin-top:12px}
.btn.alt{background:var(--sl);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.done{background:var(--ok);color:#fff}
.btn.sm{width:auto;padding:8px 14px;min-height:40px;font-size:14px;margin:0;border-radius:11px}
.hint{font-size:13px;color:var(--mute);margin:10px 2px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
.nav button{flex:1;border:0;background:none;padding:10px 4px 12px;font-size:12px;font-weight:600;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:3px;min-height:60px}
.nav button.on{color:var(--tqd)}
.sheet{position:fixed;inset:0;z-index:20;display:none}
.sheet.open{display:block}
.sheet .bd{position:absolute;inset:0;background:rgba(6,14,20,.6)}
.sheet .pn{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:480px;max-height:92dvh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom));animation:up .25s ease}
@keyframes up{from{transform:translate(-50%,40px);opacity:.4}}
@media(prefers-reduced-motion:reduce){.sheet .pn{animation:none}}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 10px}
.shd{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.shd h3{flex:1;margin:0;font-size:20px;line-height:1.2}
.x{border:0;background:var(--card);width:40px;height:40px;border-radius:50%;font-size:20px;flex:none}
.vid{background:#000;border-radius:16px;overflow:hidden;margin:0 auto 12px;position:relative}
.vid.v{aspect-ratio:9/16;max-height:58dvh}
.vid.h{aspect-ratio:16/9}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vfb{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;text-align:center;padding:20px;background:linear-gradient(160deg,#2c4054,#0c151d)}
.vfb a{background:var(--tq);color:#06302f;font-weight:700;text-decoration:none;padding:12px 18px;border-radius:12px}
.vfb p{margin:0;font-size:13px;opacity:.8;max-width:30ch}
.srow{display:grid;grid-template-columns:70px minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.srow small{color:var(--mute)}
.srow input{padding:9px 10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 13px;font-size:13.5px;font-weight:600;min-height:38px}
.chips button.on{background:var(--sl);color:#fff;border-color:var(--sl)}
.chips button i{font-style:normal;opacity:.6;margin-left:4px}
.ex{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--card);border-radius:14px;margin-bottom:8px;border:0;width:100%;text-align:left}
.ex b{display:block;font-weight:600;font-size:15px;line-height:1.3}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--sky);color:var(--ink);margin-top:3px}
.tag.CORE{background:var(--sand)}.tag.LEGS{background:#cfe9d9;color:#123}.tag.CARDIO{background:#f6d3cf;color:#311}.tag.MOVILIDAD{background:#dcd5f0;color:#213}.tag.REHAB{background:#f3e3b5;color:#321}
.empty{text-align:center;padding:30px 16px;color:var(--mute);background:var(--card);border-radius:16px}
.al{display:flex;gap:12px;align-items:center}
.av{width:46px;height:46px;border-radius:50%;background:var(--sl);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.al b{display:block}.al small{color:var(--mute)}
.feed{margin:10px 0 0;padding:0;list-style:none}
.feed li{padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.feed li small{display:block;color:var(--mute)}
.up{color:var(--ok);font-weight:700}
.ed{background:var(--card);border-radius:16px;padding:12px;margin-bottom:12px}
.edh{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-weight:700}
.edh input{width:64px;text-align:center;padding:8px}
.edh span{flex:1}
.eit{border-top:1px solid var(--line);padding:10px 0}
.eit select{margin-bottom:6px}
.es{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 40px;gap:6px;margin-bottom:6px}
.es input{padding:9px 10px}
.del{border:0;background:var(--bg);border-radius:10px;height:42px;color:var(--mute);font-size:18px}
.lnk{border:0;background:none;color:var(--tqd);font-weight:600;font-size:14px;padding:8px 0;min-height:40px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--card);border-radius:16px;padding:14px 10px;text-align:center}
.stat b{display:block;font-family:"Bebas Neue";font-size:40px;line-height:1;color:var(--tqd)}
.stat span{font-size:12.5px;color:var(--mute)}
.bdg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.bd1{background:var(--card);border-radius:16px;padding:14px 8px;text-align:center;font-size:13px;line-height:1.25}
.bd1 .md{width:58px;height:58px;margin:0 auto 8px;border-radius:50%;display:grid;place-items:center;background:var(--tq);color:#06302f;font-family:"Bebas Neue";font-size:24px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.15)}
.bd1.off{opacity:.45}.bd1.off .md{background:var(--line);color:var(--mute)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;text-align:center;font-size:12px}
.cal span{aspect-ratio:1;display:grid;place-items:center;border-radius:9px;background:var(--bg)}
.cal span.h{background:var(--tq);color:#06302f;font-weight:700}
.cal span.t{outline:2px solid var(--sl2)}
.cal em{font-style:normal;color:var(--mute);font-weight:600}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--sl);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.ok{color:var(--ok);font-size:13px;font-weight:600}.bad{color:#d0453a;font-size:13px;font-weight:600}
@media(min-width:520px){.app{box-shadow:0 0 0 1px var(--line)}}
</style>
</head>

  const cnt=c=>all.filter(k=>DB.ex[k].c===c).length;
  return `<input type="text" id="q" placeholder="Buscar ejercicio" value="${esc(S.q)}" style="margin-bottom:10px">
  <div class="chips">${['TODOS',...CATS].map(c=>`<button data-cat="${c}" class="${S.cat===c?'on':''}">${c==='TODOS'?'Todos':c[0]+c.slice(1).toLowerCase()}<i>${c==='TODOS'?all.length:cnt(c)}</i></button>`).join('')}</div>
  <button class="btn" data-newex style="margin:0 0 12px">+ Nuevo ejercicio con link de YouTube</button>
  <div id="list">${ks.length?ks.map(k=>`<button class="ex" data-edex="${k}">${thumb(k)}<div style="flex:1"><b>${esc(DB.ex[k].n)}</b><span class="tag ${DB.ex[k].c.split(' ')[0]}">${DB.ex[k].c}</span></div></button>`).join(''):`<div class="empty">${S.q?'No hay ejercicios con ese nombre.':`Todavía no hay ejercicios de ${S.cat.toLowerCase()}.<br>Pegá el link de YouTube y queda listo.`}</div>`}</div>`;
}
function exForm(k){
  const e=k?DB.ex[k]:{n:'',c:S.cat==='TODOS'?'CORE':S.cat,u:''};
  openSheet(`<div class="shd"><h3>${k?'Editar ejercicio':'Nuevo ejercicio'}</h3><button class="x" data-close aria-label="Cerrar">×</button></div>
  <div class="lbl" style="margin-top:0">Nombre</div><input type="text" id="fn" value="${esc(e.n)}" placeholder="Ej: Sentadilla búlgara">
  <div class="lbl">Categoría</div><select id="fc">${CATS.map(c=>`<option ${c===e.c?'selected':''}>${c}</option>`).join('')}</select>
  <div class="lbl">Link de YouTube</div><input type="url" id="fu" value="${esc(e.u)}" placeholder="Pegá el link (shorts o video común)"><div id="fv" style="margin-top:6px"></div>
  <div id="fp" style="margin-top:10px">${k?video(e.u):''}</div>
  <button class="btn" data-saveex="${k||''}">Guardar</button>${k?`<button class="btn ghost" data-delex="${k}">Eliminar de la biblioteca</button>`:''}`);
  const chk=()=>{const u=pn.querySelector('#fu').value.trim();pn.querySelector('#fv').innerHTML=!u?'':ytid(u)?'<span class="ok">Video detectado</span>':'<span class="bad">No reconozco ese link de YouTube</span>'};chk();
  pn.querySelector('#fu').addEventListener('input',()=>{chk();const u=pn.querySelector('#fu').value.trim();pn.querySelector('#fp').innerHTML=ytid(u)?video(u):''});
}
// ---------- EVENTOS ----------
const D=()=>DB.weeks[S.ewk].days[S.edy];
document.addEventListener('click',ev=>{
  const t=ev.target.closest('button,[data-close]');if(!t)return;const d=t.dataset;
  if('close' in d)return closeSheet();
  if(d.role){S.role=d.role;render();scrollTo(0,0);return}
  if(d.tab){S.tab=d.tab;render();scrollTo(0,0);return}
  if(d.ptab){S.ptab=d.ptab;render();scrollTo(0,0);return}
  if(d.goto){S.ptab=d.goto;S.ewk=S.wk;S.edy=S.dy;render();scrollTo(0,0);return}
  if(d.wk){S.wk=+d.wk;S.dy=0;render();return}
  if(d.dy){S.dy=+d.dy;render();return}
  if(d.vid){const e=DB.ex[d.vid];openSheet(`<div class="shd"><h3>${esc(e.n)}</h3><button class="x" data-close aria-label="Cerrar">×</button></div>${video(e.u)}<button class="btn" data-close>Listo</button>`);return}
  if(d.ex){const[b,i]=d.ex.split('-').map(Number);exSheet(b,i,d.focus!=null?+d.focus:null);return}
  if(d.done){DB.done.push({d:iso(today),k:d.done});save();render();toast('¡Bien ahí! Rutina registrada');return}
  if(d.undo){DB.done=DB.done.filter(x=>x.k!==d.undo);save();render();return}
  if(d.copy){const url='https://camilasa.fitness/r/'+d.copy;try{navigator.clipboard.writeText(url).then(()=>toast('Link copiado'),()=>toast(url))}catch(e){toast(url)}return}
  if('reset' in d){DB=seed();save();render();toast('Datos de ejemplo restablecidos');return}
  if(d.cat){S.cat=d.cat;render();return}
  if('newex' in d)return exForm();
  if(d.edex)return exForm(d.edex);
  if('saveex' in d){const n=pn.querySelector('#fn').value.trim(),c=pn.querySelector('#fc').value,u=pn.querySelector('#fu').value.trim();if(!n){toast('Poné un nombre');return}if(u&&!ytid(u)){toast('Revisá el link de YouTube');return}const k=d.saveex||('x'+Date.now().toString(36));DB.ex[k]={n,c,u};save();closeSheet();S.cat=c;render();toast('Ejercicio guardado');return}
  if(d.delex){const used=DB.weeks.some(w=>w.days.some(dy=>dy.b.some(b=>b.i.some(i=>i.e===d.delex))));if(used){toast('Está en una rutina: cambialo ahí primero');return}delete DB.ex[d.delex];save();closeSheet();render();return}
  if(d.ewk){S.ewk=+d.ewk;S.edy=0;render();return}
  if(d.edy){S.edy=+d.edy;render();return}
  if('addwk' in d){DB.weeks.push({days:[{t:'Rutina '+(DB.weeks.reduce((a,w)=>a+w.days.length,0)+1),s:'',b:[]}]});S.ewk=DB.weeks.length-1;S.edy=0;save();render();return}
  if('addday' in d){const W=DB.weeks[S.ewk];W.days.push({t:'Rutina '+(DB.weeks.reduce((a,w)=>a+w.days.length,0)+1),s:'',b:[]});S.edy=W.days.length-1;save();render();return}
  if('addb' in d){D().b.push({x:3,wu:!D().b.length,i:[{e:Object.keys(DB.ex)[1],n:'',s:[{r:'12',p:'-'}]}]});save();render();return}
  if(d.delb){D().b.splice(+d.delb,1);save();render();return}
  if(d.addi){D().b[+d.addi].i.push({e:Object.keys(DB.ex)[1],n:'',s:[{r:'12',p:'-'}]});save();render();return}
  if(d.deli){const[b,i]=d.deli.split('-').map(Number);D().b[b].i.splice(i,1);if(!D().b[b].i.length)D().b.splice(b,1);save();render();return}
  if(d.adds){const[b,i]=d.adds.split('-').map(Number),s=D().b[b].i[i].s;s.push({...s[s.length-1]});save();render();return}
  if(d.dels){const[b,i,s]=d.dels.split('-').map(Number);D().b[b].i[i].s.splice(s,1);save();render();return}
  if('preview' in d){S.role='al';S.tab='hoy';S.wk=S.ewk;S.dy=S.edy;render();scrollTo(0,0);return}
});
document.addEventListener('input',ev=>{
  const t=ev.target,d=t.dataset;
  if(t.id==='com'){DB.com[S.wk+'-'+S.dy]=t.value;save();return}
  if(t.id==='q'){S.q=t.value;const pos=t.selectionStart;render();const q=document.getElementById('q');q.focus();q.setSelectionRange(pos,pos);return}
  if(d.w){const v=t.value.trim();if(v){DB.w[d.w]=/[a-z]/i.test(v)?v:v+'kg'}else delete DB.w[d.w];save();render();return}
  if(d.f){D()[d.f]=t.value;save();return}
  if(d.x){D().b[+d.x].x=t.value.replace(/\D/g,'')||1;save();return}
  if(d.sr||d.sp){const[b,i,s]=(d.sr||d.sp).split('-').map(Number);D().b[b].i[i].s[s][d.sr?'r':'p']=t.value;save();return}
  if(d.n){const[b,i]=d.n.split('-').map(Number);D().b[b].i[i].n=t.value;save();return}
});
document.addEventListener('change',ev=>{const d=ev.target.dataset;if(d.e){const[b,i]=d.e.split('-').map(Number);D().b[b].i[i].e=ev.target.value;save()}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&sheet.classList.contains('open'))closeSheet()});
render();
}
</script>
</body>
</html>
